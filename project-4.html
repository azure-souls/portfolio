<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="p4.title">智能多窗切换系统 | 韩惟皓</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-link" data-i18n="nav.about">关于我</a>
      <a href="education.html" class="nav-link" data-i18n="nav.education">教育经历</a>
      <a href="projects.html" class="nav-link" data-i18n="nav.projects">项目经历</a>
      <button id="lang-toggle" onclick="toggleLang()" class="lang-toggle">EN</button>
    </div>
  </nav>

  <div class="container">

    <a href="projects.html" class="back-link" data-i18n="back.projects">← 返回项目</a>

    <header class="header">
      <h1 class="name" data-i18n="p4.heading">智能多窗切换系统</h1>
      <p class="subtitle" data-i18n="p4.subtitle">2024</p>
    </header>

    <section class="section">
      <h2 class="section-title" data-i18n="p4.overview">概述</h2>
      <p class="about-text" data-i18n="p4.overview.text">
        基于 STM32F103C8T6 平台开发，实现了带霍尔编码器的双路直流有刷电机同步控制。设计了基于 CC2530 芯片的 Zigbee 无线通信模块，并建立了 mesh 网络实现分布式电机控制，实现了多车间环境下各墙面窗户的统一集中切换。
      </p>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="p4.showcase">成果展示</h2>

      <div class="media-grid">
        <img src="数据/开窗器/1.jpg" alt="Window Opener" loading="lazy" onclick="openLightbox(this.src)">
        <img src="数据/开窗器/长电机.jpg" alt="Long Motor" loading="lazy" onclick="openLightbox(this.src)">
      </div>
      <div class="media-grid">
        <video src="数据/开窗器/双电机.mp4" controls preload="none" muted></video>
      </div>
    </section>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <span class="lightbox-close">&times;</span>
      <img id="lightbox-img" src="" alt="">
    </div>

    <footer class="footer">
      <p data-i18n="footer.copyright">© 2026 韩惟皓 版权所有</p>
    </footer>

  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>
  <script src="i18n.js"></script>
</body>
</html>
