<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="p2.title">基于 CARLA 的视障辅助算法研究 | 韩惟皓</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-link" data-i18n="nav.about">关于我</a>
      <a href="education.html" class="nav-link" data-i18n="nav.education">教育经历</a>
      <a href="projects.html" class="nav-link" data-i18n="nav.projects">项目经历</a>
      <button id="lang-toggle" onclick="toggleLang()" class="lang-toggle">EN</button>
    </div>
  </nav>

  <div class="container">

    <a href="projects.html" class="back-link" data-i18n="back.projects">← 返回项目</a>

    <header class="header">
      <h1 class="name" data-i18n="p2.heading">基于 CARLA 的视障辅助算法研究</h1>
      <p class="subtitle" data-i18n="p2.subtitle">2025</p>
    </header>

    <section class="section">
      <h2 class="section-title" data-i18n="p2.overview">概述</h2>
      <p class="about-text" data-i18n="p2.overview.text">
        使用 Carla 仿真平台构建了包含多种天气条件和障碍物配置的复杂交通场景数据集，部署摄像头进行驾驶数据的采集与标注。改进 YOLOv11n 轻量化目标检测模型，并开发了基于视觉语义分割的路沿检测算法，实现了视障用户在复杂环境中的实时安全路径规划与自主避障，为智能移动机器人的环境感知提供了技术方案。
      </p>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="p2.showcase">成果展示</h2>

      <div class="media-category">
        <h3 class="media-category-title" data-i18n="p2.sec1">Carla 仿真场景</h3>
        <div class="media-grid col-3">
          <img src="数据/carla/Carla仿真.jpg" alt="Carla Simulation" loading="lazy" onclick="openLightbox(this.src)">
          <img src="数据/carla/Carla仿真2.jpg" alt="Carla Simulation 2" loading="lazy" onclick="openLightbox(this.src)">
          <img src="数据/carla/Carla仿真3.jpg" alt="Carla Simulation 3" loading="lazy" onclick="openLightbox(this.src)">
        </div>
        <div class="media-grid">
          <img src="数据/carla/carla天气仿真1.png" alt="Carla Weather Simulation 1" loading="lazy" onclick="openLightbox(this.src)">
          <img src="数据/carla/carla天气仿真2.png" alt="Carla Weather Simulation 2" loading="lazy" onclick="openLightbox(this.src)">
        </div>
        <div class="media-grid">
          <img src="数据/carla/carla天气仿真3.png" alt="Carla Weather Simulation 3" loading="lazy" onclick="openLightbox(this.src)">
          <img src="数据/carla/深度语义摄像头.png" alt="Depth-based Semantic Camera" loading="lazy" onclick="openLightbox(this.src)">
        </div>
      </div>

      <div class="media-category">
        <h3 class="media-category-title" data-i18n="p2.sec2">避障演示</h3>
        <div class="media-grid">
          <video src="数据/carla/避障-.mp4" controls preload="none" muted poster="数据/carla/Carla仿真.jpg"></video>
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <span class="lightbox-close">&times;</span>
      <img id="lightbox-img" src="" alt="">
    </div>

    <footer class="footer">
      <p data-i18n="footer.copyright">© 2026 韩惟皓 版权所有</p>
    </footer>

  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>
  <script src="i18n.js"></script>
</body>
</html>
